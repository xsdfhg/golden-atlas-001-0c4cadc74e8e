name: North Canvas - Pipeline
run-name: North Canvas - Pipeline · ${{ inputs.run_tag || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: Opaque runtime correlation key
        required: false
        default: manual
        type: string
      action:
        description: start / restore / backup / rotate / stop
        required: true
        type: choice
        options:
          - start
          - restore
          - backup
          - rotate
          - stop
      instance_key:
        description: Stable instance key
        required: true
        type: string
      operation_id:
        description: Idempotent control-plane operation ID
        required: false
        default: ''
        type: string
      source_run_id:
        description: Original managed Run ID for a rotate/restart operation
        required: false
        default: '0'
        type: string
      automatic:
        description: Whether Cloudflare scheduler owns retry-until-ready
        required: false
        default: 'false'
        type: string
      config_b64:
        description: Base64 JSON instance configuration
        required: true
        type: string
      bootstrap_ticket:
        description: Short-lived Cloudflare runner capability
        required: true
        type: string
      web_url:
        description: Cloudflare control-plane URL
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: cloud-manager-automation-${{ inputs.instance_key }}
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ inputs.action }}
      INSTANCE_KEY: ${{ inputs.instance_key }}
      OPERATION_ID: ${{ inputs.operation_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      AUTOMATIC: ${{ inputs.automatic }}
      CONFIG_B64: ${{ inputs.config_b64 }}
      WEB_URL: ${{ inputs.web_url }}
